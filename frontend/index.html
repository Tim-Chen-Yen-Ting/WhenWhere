<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WhenWhere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/clock.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/grid.css" />
</head>
<body>
  <div id="app">
    <div id="map-root" aria-label="World map"></div>

    <aside id="panel">
      <header id="panel-header">
        <h1>WhenWhere</h1>
        <div id="search-wrap">
          <input id="search-input" type="text" placeholder="Add a city..." autocomplete="off" />
          <div id="search-results" hidden></div>
        </div>
      </header>

      <div id="mode-toggle" role="group" aria-label="Mode">
        <button id="mode-point" class="mode-btn is-active" type="button">Point</button>
        <button id="mode-range" class="mode-btn" type="button">Range</button>
        <button id="format-toggle" type="button" title="Toggle 12h/24h">24h</button>
      </div>

      <div id="range-window" hidden>
        <div id="range-start-clock" class="range-clock-mount"></div>
        <span class="range-sep">to</span>
        <div id="range-end-clock" class="range-clock-mount"></div>
      </div>

      <div id="working-cities"></div>

      <div id="grid-root" hidden></div>

      <p id="empty-hint">Click a city on the map, or search above, to start.</p>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@joergdietrich/leaflet.terminator@1.1.0/L.Terminator.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="js/tzmath.js"></script>
  <script src="js/map.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/search.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
