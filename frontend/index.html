<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WhenWhere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>WhenWhere</h1>

  <div class="row" id="cityRow">
    <div id="cityList" class="row" style="gap:10px;"></div>
    <button id="addCity">Add city</button>
    <a id="removeCity" href="javascript:void(0)" style="margin-left:8px;text-decoration:underline;color:#333">remove city</a>
  </div>

  <div class="row">
    <input type="date" id="dateInput" />
    <select id="hour"></select>
    <select id="minute"></select>

    <span id="endWrap" style="display:none">
        <input type="date" id="endDate" />
        <select id="endHour"></select>
        <select id="endMinute"></select>
    </span>

    <button id="run">Compute</button>

    <label class="switch" style="display:inline-flex;align-items:center;gap:8px;margin-left:8px">
        <input type="checkbox" id="rangeToggle" />
        <span class="slider"></span>
    </label>
    <span id="rangeLabel" style="font-size:14px">Range</span>
  </div>

  <div id="out"></div>

  <script src="app.js"></script>
</body>
</html>
